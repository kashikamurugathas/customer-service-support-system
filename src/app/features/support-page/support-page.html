<section class="support-page">
  <div class="support-heading"><div><div class="eyebrow">CUSTOMER OPERATIONS <span>/</span> {{ page.title | uppercase }}</div><h1>{{ page.title }}</h1><p>{{ page.description }}</p></div></div>
  <div class="support-summary"><div class="summary-icon">▤</div><div><span>{{ page.metricLabel }}</span><strong>{{ page.metric }}</strong></div><small><i></i>Updated just now</small></div>
  <section class="panel records-panel"><div class="records-header"><div><h2>{{ page.title }} directory</h2><p>{{ page.metricLabel }}</p></div></div><div class="table-note">No live {{ page.title.toLowerCase() }} query is connected in this frontend.</div><app-data-table [columns]="page.columns" [data]="filteredRows()" [emptyTitle]="'No live records available'" [emptyMessage]="'This page has not been connected to the Django GraphQL API yet.'"></app-data-table></section>
</section>
