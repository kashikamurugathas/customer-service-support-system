<section class="dashboard-page">
  <header class="page-heading">
    <div>
      <div class="eyebrow"><span class="live-dot"></span> LIVE SUPPORT DATA</div>
      <h1>Support overview</h1>
      <p>Ticket records and totals returned by the Django GraphQL API.</p>
    </div>
  </header>

  <div class="metric-grid">
    <article class="metric-card">
      <div class="metric-top">
        <span class="metric-label">Total tickets</span>
        <span class="metric-icon metric-blue" aria-hidden="true">▤</span>
      </div>
      <div class="metric-value">{{ totalTickets() ?? '—' }}</div>
      <div class="metric-foot">Reported by the backend</div>
    </article>
  </div>

  <section class="panel tickets-panel">
    <div class="panel-heading tickets-heading">
      <div>
        <h2>Tickets</h2>
        <p>Ticket records returned by the backend</p>
      </div>
    </div>
    <app-data-table
      [columns]="columns"
      [data]="tickets()"
      [loading]="loading()"
      [errorMessage]="error()"
      [emptyTitle]="'No tickets available'"
      [emptyMessage]="'The backend has not returned any ticket records.'"
      (retry)="loadTickets()"
    ></app-data-table>
  </section>
</section>
