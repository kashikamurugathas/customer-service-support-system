<section class="space-y-6 p-4 md:p-6">
  <header>
    <p class="text-sm font-semibold tracking-wide text-indigo-600">CUSTOMER OPERATIONS / COMPLAINTS</p>
    <h1 class="mt-2 text-2xl font-semibold text-slate-900">Complaint Management</h1>
    <p class="mt-1 text-sm text-slate-600">Customer concerns and their current status from the backend.</p>
  </header>

  <app-data-table
    [columns]="columns"
    [data]="complaints()"
    [loading]="loading()"
    [errorMessage]="error()"
    [serverSide]="true"
    [totalRecords]="totalRecords()"
    [selectable]="true"
    [pageSize]="pageSize()"
    (pageSizeChange)="pageSize.set($event); load()"
    [currentPage]="page()"
    (currentPageChange)="page.set($event); load()"
    [searchPlaceholder]="'Search subject, description, category, value, source, or sentiment'"
    (searchChange)="onSearch($event)"
    [emptyTitle]="'No complaints found'"
    [emptyMessage]="'The backend returned no complaint records.'"
    (retry)="load()"
  ></app-data-table>
</section>
