<section class="space-y-6 p-4 md:p-6">
  <header>
    <p class="text-sm font-semibold tracking-wide text-indigo-600">CUSTOMER OPERATIONS / USERS</p>
    <h1 class="mt-2 text-2xl font-semibold text-slate-900">User Management</h1>
    <p class="mt-1 text-sm text-slate-600">User accounts returned by the Django GraphQL API.</p>
  </header>

  <app-data-table
    [columns]="columns"
    [data]="users()"
    [loading]="loading()"
    [errorMessage]="error()"
    [selectable]="true"
    [emptyTitle]="'No users found'"
    [emptyMessage]="'The backend returned no user records.'"
    (retry)="load()"
  ></app-data-table>
</section>
