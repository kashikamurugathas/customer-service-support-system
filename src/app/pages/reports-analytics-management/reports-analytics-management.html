<section class="space-y-6 p-4 md:p-6">
  <header>
    <p class="text-sm font-semibold tracking-wide text-indigo-600">CUSTOMER OPERATIONS / INSIGHTS</p>
    <h1 class="mt-2 text-2xl font-semibold text-slate-900">Reports &amp; Analytics</h1>
    <p class="mt-1 text-sm text-slate-600">Stored report records and data returned by the backend.</p>
  </header>

  <app-data-table
    [columns]="columns"
    [data]="reports()"
    [loading]="loading()"
    [errorMessage]="error()"
    [serverSide]="true"
    [totalRecords]="totalRecords()"
    [selectable]="true"
    [pageSize]="pageSize()"
    (pageSizeChange)="pageSize.set($event); load()"
    [currentPage]="page()"
    (currentPageChange)="page.set($event); load()"
    [searchPlaceholder]="'Search report title or type'"
    (searchChange)="onSearch($event)"
    [emptyTitle]="'No reports found'"
    [emptyMessage]="'The backend returned no report records.'"
    (retry)="load()"
  ></app-data-table>
</section>
